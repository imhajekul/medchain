version: '3.8'

services:
  # ─── 1. MongoDB Database Service ─────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: medvault-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-medvault}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-medvault_secure_password_2026}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-medvault}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medvault-network

  # ─── 2. MedVault Core Backend (Zero PHI Exposure) ──────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medvault-server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-medvault}:${MONGO_INITDB_ROOT_PASSWORD:-medvault_secure_password_2026}@mongodb:27017/medvault?authSource=admin
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-medvault}:${MONGO_INITDB_ROOT_PASSWORD:-medvault_secure_password_2026}@mongodb:27017/medvault?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-bf3566236c23ee0fb9bbd88ac08f1ab8ff585c1d0b87b135d6f93b70c16222e8}
      RPC_URL: ${RPC_URL:-https://polygon-amoy-bor-rpc.publicnode.com}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-0x38b8AcE4624DEb11568A57866e4a28Ece055D0f6}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      PINATA_API_KEY: ${PINATA_API_KEY:-}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY:-}
      PINATA_JWT: ${PINATA_JWT:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
    volumes:
      - server_storage:/app/storage_blobs
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - medvault-network

  # ─── 3. MedVault Web Client (Nginx + React SPA) ─────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: medvault-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - medvault-network

volumes:
  mongodb_data:
    name: medvault_mongodb_data
  server_storage:
    name: medvault_server_storage

networks:
  medvault-network:
    name: medvault-network
    driver: bridge
