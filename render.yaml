# ==============================================================================
# Render Blueprint: MedVault Core Backend & PostgreSQL
# Optimized for Frontend on Vercel + Backend on Render Architecture
# ==============================================================================

services:
  # ─── MedVault Core API Web Service ──────────────────────────────
  - type: web
    name: medvault-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node index.js
    plan: free # Can be upgraded to 'starter' or 'standard' for production SLAs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medvault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology/
      - key: CONTRACT_ADDRESS
        value: 0x38b8AcE4624DEb11568A57866e4a28Ece055D0f6
      - key: RELAYER_PRIVATE_KEY
        sync: false # Set securely in Render dashboard
      - key: CORS_ORIGIN
        value: "*" # Permits Vercel domains, or specify your exact *.vercel.app domain
      - key: RATE_LIMIT_MAX
        value: "1000"

# ─── Managed PostgreSQL Database on Render ─────────────────────────
databases:
  - name: medvault-db
    databaseName: medvault
    user: medvault
    plan: free # or 'starter'
