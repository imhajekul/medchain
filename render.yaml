# ==============================================================================
# Render Blueprint: Full-Stack MedVault on Render
# Frontend: Static Site (CDN) | Backend: Web Service (Node.js) | DB: PostgreSQL
# ==============================================================================

services:
  # ─── 1. MedVault Backend Web Service ────────────────────────────
  - type: web
    name: medvault-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node index.js
    plan: free # or 'starter'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology/
      - key: CONTRACT_ADDRESS
        value: 0x38b8AcE4624DEb11568A57866e4a28Ece055D0f6
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: RATE_LIMIT_MAX
        value: "1000"

  # ─── 2. MedVault Frontend Static Site (React + Vite) ─────────────
  - type: web
    name: medvault-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medvault-api
          property: host
      - key: VITE_CHAIN_ID
        value: "80002"
      - key: VITE_CONTRACT_ADDRESS
        value: "0x38b8AcE4624DEb11568A57866e4a28Ece055D0f6"
