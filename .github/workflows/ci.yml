name: MedVault CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── 1. Backend Verification & Invariant Tests ────────────────
  backend-test:
    name: Backend API & Security Invariant Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medvault_test
          POSTGRES_PASSWORD: medvault_test_password
          POSTGRES_DB: medvault_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Apply Database Migrations
        working-directory: server
        env:
          DATABASE_URL: postgresql://medvault_test:medvault_test_password@localhost:5432/medvault_test_db?schema=public
        run: |
          psql postgresql://medvault_test:medvault_test_password@localhost:5432/medvault_test_db -f migrations/schema.sql || true

      - name: Start Backend Daemon
        working-directory: server
        env:
          PORT: 3001
          NODE_ENV: test
          DATABASE_URL: postgresql://medvault_test:medvault_test_password@localhost:5432/medvault_test_db?schema=public
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_random
        run: |
          node index.js &
          sleep 4

      - name: Run End-to-End API Specification Test Suite
        working-directory: server
        run: node test-api-spec.js

  # ─── 2. Frontend Build & Bundle Optimization ──────────────────
  frontend-build:
    name: Client Web Application Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci || npm install

      - name: Run Production Bundle Build
        working-directory: client
        run: npm run build

      - name: Verify Distribution Artifacts
        working-directory: client
        run: |
          test -f dist/index.html
          echo "Client production artifacts successfully compiled."

  # ─── 3. Docker Container Build Verification ───────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: medvault-server:latest

      - name: Build Client Container
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: medvault-client:latest
