apiVersion: v1
kind: Namespace
metadata:
  name: medvault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medvault-config
  namespace: medvault
data:
  NODE_ENV: "production"
  PORT: "3001"
  RPC_URL: "https://polygon-amoy-bor-rpc.publicnode.com"
  CONTRACT_ADDRESS: "0x38b8AcE4624DEb11568A57866e4a28Ece055D0f6"
  CORS_ORIGIN: "https://medvault.app"
  RATE_LIMIT_MAX: "1000"
---
apiVersion: v1
kind: Secret
metadata:
  name: medvault-secret
  namespace: medvault
type: Opaque
stringData:
  DATABASE_URL: "postgresql://medvault:medvault_k8s_secret_pass@medvault-postgres:5432/medvault?schema=public"
  JWT_SECRET: "k8s_production_medvault_secret_key_minimum_64_characters_random_hex"
  RELAYER_PRIVATE_KEY: ""
  PINATA_JWT: ""
---
# ─── MedVault Backend Deployment ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medvault-server
  namespace: medvault
  labels:
    app: medvault-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: medvault-server
  template:
    metadata:
      labels:
        app: medvault-server
    spec:
      containers:
        - name: server
          image: ghcr.io/medvault/medvault-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: medvault-config
            - secretRef:
                name: medvault-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medvault-server
  namespace: medvault
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: medvault-server
---
# ─── MedVault Client Deployment ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medvault-client
  namespace: medvault
  labels:
    app: medvault-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medvault-client
  template:
    metadata:
      labels:
        app: medvault-client
    spec:
      containers:
        - name: client
          image: ghcr.io/medvault/medvault-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: medvault-client
  namespace: medvault
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: medvault-client
---
# ─── Ingress with TLS Termination ────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medvault-ingress
  namespace: medvault
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "60m"
spec:
  tls:
    - hosts:
        - medvault.app
        - api.medvault.app
      secretName: medvault-tls
  rules:
    - host: medvault.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medvault-client
                port:
                  number: 80
    - host: api.medvault.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medvault-server
                port:
                  number: 3001
